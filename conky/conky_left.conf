conky.config = {
    alignment = 'top_left',

    background = true,
    double_buffer = true,

    out_to_x = false,
    out_to_wayland = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',

    font = 'DejaVu Sans Mono:size=9',
    use_xft = true,

    gap_x = 15,
    gap_y = 15,

    minimum_width = 390,
    minimum_height = 500,

    update_interval = 1,

    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    default_color = 'white',
}

conky.text = [[
${font DejaVu Sans Mono:bold:size=11}SYSTEM MONITOR${font}
${hr}

CPU   ${cpu}%  ${cpubar 8,250}
RAM   ${memperc}%  ${membar 8,250}
SWAP  ${swapperc}%  ${swapbar 8,250}

${font DejaVu Sans Mono:bold:size=10}CPU${font}
${cpugraph 30,380}

${font DejaVu Sans Mono:bold:size=10}MEMORY${font}
${mem} / ${memmax}

${font DejaVu Sans Mono:bold:size=10}SYSTEM${font}
Uptime     ${uptime}
Processes  ${processes}
Running    ${running_processes}
Load       ${loadavg}

${font DejaVu Sans Mono:bold:size=10}DISK${font}
${fs_used /} / ${fs_size /}
${fs_bar 8,380 /}

${font DejaVu Sans Mono:bold:size=10}NETWORK${font}
↓ ${downspeed enp4s0}     ↑ ${upspeed enp4s0}
${downspeedgraph enp4s0 25,180} ${upspeedgraph enp4s0 25,180}

${font DejaVu Sans Mono:bold:size=10}TOP PROCESSES${font}
${hr}
${top name 1}   ${top cpu 1}%
${top name 2}   ${top cpu 2}%
${top name 3}   ${top cpu 3}%
${top name 4}   ${top cpu 4}%
${top name 5}   ${top cpu 5}
]]
